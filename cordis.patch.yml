# dsh-translate-this bundle patch: inserts the translate-this row into a profile
# roster. Applied as a profile bundle layer; the row is a bare plugin by package
# name.
#
# The host half (exports ".") is deliberately thin in 0.5: the layer that had to
# survive — the DOM injector — lives entirely in the browser half, and the engine
# is still a fixed stub (PLAN.md §8: 0.5 ships with "a fixed engine, no model, no
# network"). The model call (ctx.llm.stream, decision D5) lands in 0.6 and that is
# the only reason this file will grow.
#
# The browser half needs no row of its own: the `dsh.client` declaration in
# package.json (platform "web") is what loads exports "./client" in the GUI.
- insert:
    - id: translate-this
      name: dsh-translate-this
